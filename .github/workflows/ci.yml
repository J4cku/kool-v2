name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default
permissions:
  contents: read

jobs:
  check:
    name: Lint · Types · i18n · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuse Next's compiler cache across runs so builds stay fast
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Each gate is its own step so the PR check shows exactly what failed.
      # `!cancelled()` lets every gate run in a single push, surfacing all
      # problems at once instead of stopping at the first failure.
      - name: Unit & integration tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Translation parity (pl/en)
        if: ${{ !cancelled() }}
        run: pnpm check:i18n

      - name: Production build
        if: ${{ !cancelled() }}
        run: pnpm build
