name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default
permissions:
  contents: read

jobs:
  check:
    name: Lint · Types · i18n · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuse Next's compiler cache across runs so builds stay fast
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Each gate is its own step so the PR check shows exactly what failed.
      # `!cancelled()` lets every gate run in a single push, surfacing all
      # problems at once instead of stopping at the first failure.
      - name: Unit & integration tests
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Translation parity (pl/en)
        if: ${{ !cancelled() }}
        run: pnpm check:i18n

      - name: Production build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          pnpm build | tee "$RUNNER_TEMP/build.log"

      # Report First Load JS into the run summary (informational, non-blocking)
      - name: Bundle size (First Load JS)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### Bundle size — First Load JS'
            echo
            echo '```'
            sed -n '/Route (app)/,/First Load JS shared/p' "$RUNNER_TEMP/build.log" || echo '(size table not found)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser QA (routes · console)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Builds + serves the production output, then drives every sitemap route
      # in a real browser asserting 200 + no console errors / uncaught exceptions
      - name: Browser QA
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Category budgets are warn-level for now so a flaky runner never blocks a
      # merge; promote to "error" once the baseline scores are known.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
