name: Dependabot auto-merge

on: pull_request

# Dependabot-triggered runs get these scopes (but no repo secrets), which is
# all that's needed to turn on auto-merge via the built-in GITHUB_TOKEN.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      # Auto-merge patch & minor updates once the required checks pass; leave
      # major version bumps for manual review. Auto-merge still waits on branch
      # protection, so nothing lands red.
      - name: Enable auto-merge (patch & minor)
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
